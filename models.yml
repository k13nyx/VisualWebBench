# Candidate models for the VisualWebBench score-vs-cost study.
# Every model is called through OpenRouter (one API, one key).
#
# Model IDs and prices were checked against OpenRouter's live model list on
# 2026-10-30. Prices are USD per 1M tokens for the PINNED HOST below.
# They are only a fallback: when OpenRouter returns the billed cost (it normally
# does), run_api2.py records and uses that instead.

env:
  base_url: https://openrouter.ai/api/v1
  api_key: OPENROUTER_API_KEY

models:
  # ---------------- Open-weight (all via OpenRouter) ----------------
  deepseek-v4.1-flash:
